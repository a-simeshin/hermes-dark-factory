<svg viewBox="0 0 1200 688" xmlns="http://www.w3.org/2000/svg" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <style>
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
      .lane { fill: #4f5d75; font-size: 9px; letter-spacing: 0.18em; }
      .stage { fill: #4f5d75; font-size: 9px; letter-spacing: 0.16em; }
      .name { fill: #2d3142; font-size: 12px; font-weight: 600; }
      .sub { fill: #4f5d75; font-size: 9px; }
      .lbl { fill: #4f5d75; font-size: 8px; letter-spacing: 0.08em; }
      .lbl-accent { fill: #eb6c36; font-size: 8px; letter-spacing: 0.08em; }
      .lbl-link { fill: #2e5aa8; font-size: 8px; letter-spacing: 0.08em; }
      .leg { fill: #4f5d75; font-size: 9px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="32" class="mono stage">HERMES DARK FACTORY</text>
  <text x="40" y="64" class="serif" fill="#2d3142" font-size="28">From an idea to a merged pull request</text>

  <!-- Stage headers -->
  <text x="256" y="92" class="mono stage" text-anchor="middle">1 · INTAKE</text>
  <text x="424" y="92" class="mono stage" text-anchor="middle">2 · ADMISSION</text>
  <text x="592" y="92" class="mono stage" text-anchor="middle">3 · PLAN</text>
  <text x="760" y="92" class="mono stage" text-anchor="middle">4 · BUILD</text>
  <text x="928" y="92" class="mono stage" text-anchor="middle">5 · REVIEW</text>
  <text x="1096" y="92" class="mono stage" text-anchor="middle">6 · MERGE</text>

  <!-- Lane dividers -->
  <line x1="40" y1="104" x2="1176" y2="104" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <line x1="40" y1="200" x2="1176" y2="200" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="296" x2="1176" y2="296" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="392" x2="1176" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="488" x2="1176" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <line x1="40" y1="584" x2="1176" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <line x1="168" y1="104" x2="168" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

  <!-- Stage column guides -->
  <line x1="340" y1="104" x2="340" y2="584" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
  <line x1="508" y1="104" x2="508" y2="584" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
  <line x1="676" y1="104" x2="676" y2="584" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
  <line x1="844" y1="104" x2="844" y2="584" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
  <line x1="1012" y1="104" x2="1012" y2="584" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>

  <!-- Lane labels -->
  <text x="56" y="156" class="mono lane">OWNER</text>
  <text x="56" y="252" class="mono lane">TELEGRAM</text>
  <text x="56" y="264" class="mono lane">GATEWAY</text>
  <text x="56" y="348" class="mono lane">GITHUB</text>
  <text x="56" y="444" class="mono lane">KANBAN BOARD</text>
  <text x="56" y="532" class="mono lane">AGENT</text>
  <text x="56" y="544" class="mono lane">PROFILES</text>

  <!-- Arrows (drawn before boxes) -->
  <!-- Idea to front desk -->
  <line x1="256" y1="180" x2="256" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <!-- Front desk mirrors to an issue -->
  <path d="M328 248 H340 V344 H348" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <!-- Owner files an issue directly -->
  <path d="M328 152 H424 V312" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
  <!-- Issue poll -->
  <line x1="424" y1="372" x2="424" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Dispatch to architect -->
  <path d="M496 440 H592 V504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Architect to coder -->
  <line x1="664" y1="536" x2="684" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Coder opens the PR -->
  <path d="M760 508 V344 H852" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <!-- Coder requests review -->
  <line x1="832" y1="536" x2="852" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Reviewer posts the verdict -->
  <line x1="928" y1="508" x2="928" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <!-- Changes requested loop -->
  <path d="M904 564 V576 H784 V568" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <!-- Ready for the owner -->
  <path d="M1000 332 H1012 V152 H1020" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <!-- Watchdogs notify through the gateway -->
  <line x1="1096" y1="412" x2="1096" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Reports reach the owner's phone -->
  <line x1="1096" y1="220" x2="1096" y2="184" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- Arrow labels (masked) -->
  <rect x="212" y="188" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="256" y="197" class="mono lbl-link" text-anchor="middle">CHAT MESSAGE</text>
  <rect x="380" y="216" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="424" y="225" class="mono lbl-link" text-anchor="middle">OR FILE ISSUE</text>
  <rect x="300" y="300" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="340" y="309" class="mono lbl-link" text-anchor="middle">MIRROR ISSUE</text>
  <rect x="384" y="380" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="424" y="389" class="mono lbl" text-anchor="middle">ISSUE POLL</text>
  <rect x="516" y="428" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="546" y="437" class="mono lbl" text-anchor="middle">DISPATCH</text>
  <rect x="720" y="424" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="760" y="433" class="mono lbl-link" text-anchor="middle">PR + WCFY</text>
  <rect x="896" y="424" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="928" y="433" class="mono lbl-link" text-anchor="middle">VERDICT</text>
  <rect x="808" y="570" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="844" y="579" class="mono lbl" text-anchor="middle">CHANGES</text>
  <text x="1004" y="244" class="mono lbl-accent" text-anchor="end">READY</text>
  <rect x="1060" y="336" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1096" y="345" class="mono lbl" text-anchor="middle">NOTIFY</text>

  <!-- Nodes -->
  <!-- Owner: idea -->
  <rect x="184" y="124" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="256" y="148" class="name" text-anchor="middle">Idea or bug</text>
  <text x="256" y="164" class="mono sub" text-anchor="middle">owner</text>

  <!-- Gateway: front desk -->
  <rect x="184" y="220" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="184" y="220" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="256" y="244" class="name" text-anchor="middle">Front desk</text>
  <text x="256" y="260" class="mono sub" text-anchor="middle">default profile · triage</text>

  <!-- GitHub: issue -->
  <rect x="352" y="316" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="352" y="316" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="424" y="340" class="name" text-anchor="middle">Issue</text>
  <text x="424" y="356" class="mono sub" text-anchor="middle">milestone = approval</text>

  <!-- Board: admission and dispatch -->
  <rect x="352" y="412" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="352" y="412" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="424" y="436" class="name" text-anchor="middle">Admission</text>
  <text x="424" y="452" class="mono sub" text-anchor="middle">priority bands · dispatch</text>

  <!-- Agents: architect -->
  <rect x="520" y="508" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="592" y="532" class="name" text-anchor="middle">Architect</text>
  <text x="592" y="548" class="mono sub" text-anchor="middle">decompose · plan review</text>

  <!-- Agents: coder -->
  <rect x="688" y="508" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="760" y="532" class="name" text-anchor="middle">Coder</text>
  <text x="760" y="548" class="mono sub" text-anchor="middle">one PR = one card</text>

  <!-- Agents: reviewer -->
  <rect x="856" y="508" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="928" y="532" class="name" text-anchor="middle">Reviewer</text>
  <text x="928" y="548" class="mono sub" text-anchor="middle">adversarial · on head</text>

  <!-- GitHub: pull request -->
  <rect x="856" y="316" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="856" y="316" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="928" y="340" class="name" text-anchor="middle">Pull request</text>
  <text x="928" y="356" class="mono sub" text-anchor="middle">CI · verdict · WCFY</text>

  <!-- Board: watchdogs -->
  <rect x="1024" y="412" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="1024" y="412" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="1096" y="436" class="name" text-anchor="middle">Watchdogs</text>
  <text x="1096" y="452" class="mono sub" text-anchor="middle">merge hold · reclaim</text>

  <!-- Gateway: reports -->
  <rect x="1024" y="220" width="144" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="1024" y="220" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="1096" y="244" class="name" text-anchor="middle">Reports</text>
  <text x="1096" y="260" class="mono sub" text-anchor="middle">alerts · evening digest</text>

  <!-- Owner: review and merge (focal) -->
  <rect x="1024" y="124" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="1096" y="148" class="name" text-anchor="middle">Owner review</text>
  <text x="1096" y="164" class="mono sub" text-anchor="middle">approve · squash merge</text>

  <!-- Legend -->
  <line x1="40" y1="612" x2="1176" y2="612" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="632" class="mono stage">LEGEND</text>

  <rect x="40" y="648" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="64" y="658" class="leg">Agent step</text>
  <rect x="152" y="648" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="176" y="658" class="leg">Pack script or gate</text>
  <rect x="300" y="648" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="324" y="658" class="leg">External system</text>
  <rect x="436" y="648" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="460" y="658" class="leg">Owner decision</text>

  <line x1="568" y1="654" x2="596" y2="654" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="604" y="658" class="leg">Internal handoff</text>
  <line x1="716" y1="654" x2="744" y2="654" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="752" y="658" class="leg">GitHub or Telegram</text>
  <line x1="880" y1="654" x2="908" y2="654" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="916" y="658" class="leg">Alternative or loop</text>
  <line x1="1040" y1="654" x2="1068" y2="654" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <text x="1076" y="658" class="leg">To the owner</text>
</svg>
