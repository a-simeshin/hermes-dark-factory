<svg viewBox="0 0 1000 1280" width="1000" height="1280" xmlns="http://www.w3.org/2000/svg" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <style>
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .eyebrow { fill: #4f5d75; font-size: 12px; letter-spacing: 0.12em; }
      .name { fill: #2d3142; font-size: 15px; font-weight: 600; }
      .sub { fill: #4f5d75; font-size: 12px; }
      .lbl { fill: #4f5d75; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-accent { fill: #eb6c36; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-link { fill: #2e5aa8; font-size: 12px; letter-spacing: 0.06em; }
      .stage { fill: #4f5d75; font-size: 12px; letter-spacing: 0.06em; }
      .leg { fill: #4f5d75; font-size: 12px; }
      .note { fill: #4f5d75; font-size: 12px; }
    </style>
  </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="24" y="36" class="mono eyebrow" text-anchor="start">HERMES DARK FACTORY</text>
<text x="24" y="72" class="serif" fill="#2d3142" font-size="28">From an idea to a merged pull request</text>
<text x="192" y="116" class="mono eyebrow" text-anchor="middle">OWNER</text>
<text x="368" y="116" class="mono eyebrow" text-anchor="middle">TELEGRAM GATEWAY</text>
<text x="544" y="116" class="mono eyebrow" text-anchor="middle">GITHUB</text>
<text x="720" y="116" class="mono eyebrow" text-anchor="middle">KANBAN BOARD</text>
<text x="896" y="116" class="mono eyebrow" text-anchor="middle">AGENT PROFILES</text>
<line x1="24" y1="128" x2="984" y2="128" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<line x1="280" y1="128" x2="280" y2="1176" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
<line x1="456" y1="128" x2="456" y2="1176" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
<line x1="632" y1="128" x2="632" y2="1176" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
<line x1="808" y1="128" x2="808" y2="1176" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
<line x1="104" y1="128" x2="104" y2="1176" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<text x="24" y="156" class="mono stage" text-anchor="start">STAGE 1</text>
<text x="24" y="176" class="mono stage" text-anchor="start">INTAKE</text>
<line x1="24" y1="352" x2="984" y2="352" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
<text x="24" y="380" class="mono stage" text-anchor="start">STAGE 2</text>
<text x="24" y="400" class="mono stage" text-anchor="start">ADMISSION</text>
<line x1="24" y1="576" x2="984" y2="576" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
<text x="24" y="604" class="mono stage" text-anchor="start">STAGE 3</text>
<text x="24" y="624" class="mono stage" text-anchor="start">PLAN</text>
<line x1="24" y1="696" x2="984" y2="696" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
<text x="24" y="724" class="mono stage" text-anchor="start">STAGE 4</text>
<text x="24" y="744" class="mono stage" text-anchor="start">BUILD</text>
<line x1="24" y1="816" x2="984" y2="816" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
<text x="24" y="844" class="mono stage" text-anchor="start">STAGE 5</text>
<text x="24" y="864" class="mono stage" text-anchor="start">REVIEW</text>
<line x1="24" y1="952" x2="984" y2="952" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
<text x="24" y="980" class="mono stage" text-anchor="start">STAGE 6</text>
<text x="24" y="1000" class="mono stage" text-anchor="start">MERGE</text>
<line x1="24" y1="1176" x2="984" y2="1176" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<!-- arrows -->
<path d="M192 220 L192 296 L288 296" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M272 184 L544 184 L544 376" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
<path d="M368 332 L368 412 L464 412" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M544 448 L544 516 L640 516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M720 552 L720 636 L816 636" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M896 672 L896 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M816 756 L544 756 L544 856" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M864 792 L864 856" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M928 856 L928 792" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M816 892 L624 892" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M464 892 L192 892 L192 976" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M640 1116 L448 1116" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M288 1116 L192 1116 L192 1048" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<!-- nodes -->
<g data-node="Idea or bug">
<rect x="112" y="148" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="112" y="148" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="192" y="172" class="name" text-anchor="middle">Idea or bug</text>
<text x="192" y="192" class="mono sub" text-anchor="middle">owner</text>
<text x="192" y="208" class="mono sub" text-anchor="middle">chat or issue</text>
</g>
<g data-node="Front desk">
<rect x="288" y="260" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="288" y="260" width="160" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="368" y="284" class="name" text-anchor="middle">Front desk</text>
<text x="368" y="304" class="mono sub" text-anchor="middle">default profile</text>
<text x="368" y="320" class="mono sub" text-anchor="middle">triage card</text>
</g>
<g data-node="Issue">
<rect x="464" y="376" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="464" y="376" width="160" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="544" y="400" class="name" text-anchor="middle">Issue</text>
<text x="544" y="420" class="mono sub" text-anchor="middle">milestone means</text>
<text x="544" y="436" class="mono sub" text-anchor="middle">approved</text>
</g>
<g data-node="Admission">
<rect x="640" y="480" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="640" y="480" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="720" y="504" class="name" text-anchor="middle">Admission</text>
<text x="720" y="524" class="mono sub" text-anchor="middle">priority bands</text>
<text x="720" y="540" class="mono sub" text-anchor="middle">dispatch</text>
</g>
<g data-node="Architect">
<rect class="box" x="816" y="600" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="896" y="624" class="name" text-anchor="middle">Architect</text>
<text x="896" y="644" class="mono sub" text-anchor="middle">decompose</text>
<text x="896" y="660" class="mono sub" text-anchor="middle">plan review</text>
</g>
<g data-node="Coder">
<rect class="box" x="816" y="720" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="896" y="744" class="name" text-anchor="middle">Coder</text>
<text x="896" y="764" class="mono sub" text-anchor="middle">one PR = one card</text>
<text x="896" y="780" class="mono sub" text-anchor="middle">WCFY, then review</text>
</g>
<g data-node="Reviewer">
<rect class="box" x="816" y="856" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="896" y="880" class="name" text-anchor="middle">Reviewer</text>
<text x="896" y="900" class="mono sub" text-anchor="middle">adversarial</text>
<text x="896" y="916" class="mono sub" text-anchor="middle">verdict on head</text>
</g>
<g data-node="Pull request">
<rect x="464" y="856" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="464" y="856" width="160" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="544" y="880" class="name" text-anchor="middle">Pull request</text>
<text x="544" y="900" class="mono sub" text-anchor="middle">CI, WCFY</text>
<text x="544" y="916" class="mono sub" text-anchor="middle">review verdict</text>
</g>
<g data-node="Owner review">
<rect x="112" y="976" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="112" y="976" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="192" y="1000" class="name" text-anchor="middle">Owner review</text>
<text x="192" y="1020" class="mono sub" text-anchor="middle">approve</text>
<text x="192" y="1036" class="mono sub" text-anchor="middle">squash merge</text>
</g>
<g data-node="Watchdogs">
<rect x="640" y="1080" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="640" y="1080" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="720" y="1104" class="name" text-anchor="middle">Watchdogs</text>
<text x="720" y="1124" class="mono sub" text-anchor="middle">merge hold</text>
<text x="720" y="1140" class="mono sub" text-anchor="middle">reclaim</text>
</g>
<g data-node="Reports">
<rect x="288" y="1080" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="288" y="1080" width="160" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="368" y="1104" class="name" text-anchor="middle">Reports</text>
<text x="368" y="1124" class="mono sub" text-anchor="middle">alerts</text>
<text x="368" y="1140" class="mono sub" text-anchor="middle">evening digest</text>
</g>
<!-- labels -->
<rect x="136" y="244" width="112" height="16" rx="2" fill="#f5f5f5"/>
<text x="192" y="256" class="mono lbl-link" text-anchor="middle">CHAT MESSAGE</text>
<rect x="336" y="176" width="144" height="16" rx="2" fill="#f5f5f5"/>
<text x="408" y="188" class="mono lbl-link" text-anchor="middle">OR FILE AN ISSUE</text>
<rect x="312" y="364" width="112" height="16" rx="2" fill="#f5f5f5"/>
<text x="368" y="376" class="mono lbl-link" text-anchor="middle">MIRROR ISSUE</text>
<rect x="496" y="472" width="96" height="16" rx="2" fill="#f5f5f5"/>
<text x="544" y="484" class="mono lbl" text-anchor="middle">ISSUE POLL</text>
<rect x="680" y="588" width="80" height="16" rx="2" fill="#f5f5f5"/>
<text x="720" y="600" class="mono lbl" text-anchor="middle">DISPATCH</text>
<rect x="636" y="748" width="88" height="16" rx="2" fill="#f5f5f5"/>
<text x="680" y="760" class="mono lbl-link" text-anchor="middle">PR + WCFY</text>
<text x="856" y="828" class="mono lbl" text-anchor="end">REQUEST REVIEW</text>
<rect x="892" y="816" width="72" height="16" rx="2" fill="#f5f5f5"/>
<text x="928" y="828" class="mono lbl" text-anchor="middle">CHANGES</text>
<rect x="684" y="884" width="72" height="16" rx="2" fill="#f5f5f5"/>
<text x="720" y="896" class="mono lbl-link" text-anchor="middle">VERDICT</text>
<rect x="300" y="884" width="56" height="16" rx="2" fill="#f5f5f5"/>
<text x="328" y="896" class="mono lbl-accent" text-anchor="middle">READY</text>
<rect x="512" y="1108" width="64" height="16" rx="2" fill="#f5f5f5"/>
<text x="544" y="1120" class="mono lbl" text-anchor="middle">NOTIFY</text>
<rect x="208" y="1108" width="64" height="16" rx="2" fill="#f5f5f5"/>
<text x="240" y="1120" class="mono lbl-link" text-anchor="middle">ALERTS</text>
<line x1="24" y1="1192" x2="976" y2="1192" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="24" y="1216" class="mono eyebrow" text-anchor="start">LEGEND</text>
<rect x="24" y="1232" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="48" y="1243" class="leg">Agent step</text>
<rect x="144" y="1232" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="168" y="1243" class="leg">Pack script or gate</text>
<rect x="328" y="1232" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="352" y="1243" class="leg">External system</text>
<rect x="484" y="1232" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="508" y="1243" class="leg">Owner input</text>
<rect x="612" y="1232" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="636" y="1243" class="leg">Owner decision</text>
<line x1="760" y1="1238" x2="788" y2="1238" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="796" y="1243" class="leg">Internal handoff</text>
<line x1="24" y1="1262" x2="52" y2="1262" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<text x="60" y="1267" class="leg">GitHub or Telegram</text>
<line x1="212" y1="1262" x2="240" y2="1262" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="248" y="1267" class="leg">Alternative or loop</text>
<line x1="408" y1="1262" x2="436" y2="1262" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="444" y="1267" class="leg">To the owner</text>
</svg>
