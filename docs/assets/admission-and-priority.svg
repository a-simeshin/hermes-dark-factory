<svg viewBox="0 0 1000 1296" width="1000" height="1296" xmlns="http://www.w3.org/2000/svg" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <style>
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .eyebrow { fill: #4f5d75; font-size: 12px; letter-spacing: 0.12em; }
      .name { fill: #2d3142; font-size: 15px; font-weight: 600; }
      .sub { fill: #4f5d75; font-size: 12px; }
      .lbl { fill: #4f5d75; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-accent { fill: #eb6c36; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-link { fill: #2e5aa8; font-size: 12px; letter-spacing: 0.06em; }
      .stage { fill: #4f5d75; font-size: 12px; letter-spacing: 0.06em; }
      .leg { fill: #4f5d75; font-size: 12px; }
      .note { fill: #4f5d75; font-size: 12px; }
    </style>
  </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="24" y="36" class="mono eyebrow" text-anchor="start">HERMES DARK FACTORY</text>
<text x="24" y="72" class="serif" fill="#2d3142" font-size="28">From an approved issue to a claimed run</text>
<text x="24" y="112" class="mono eyebrow" text-anchor="start">PRIORITY</text>
<text x="312" y="112" class="mono eyebrow" text-anchor="start">PATH OF A CARD</text>
<text x="600" y="112" class="mono eyebrow" text-anchor="start">GATES AND HOLDS</text>
<line x1="24" y1="124" x2="976" y2="124" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<!-- arrows -->
<path d="M312 184 L264 184" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M144 220 L144 268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M432 220 L432 268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M552 320 L600 320" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M144 356 L144 404" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M264 420 L288 420 L288 320 L312 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M264 480 L312 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M432 372 L432 436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M552 480 L600 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M776 488 L816 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M896 540 L896 560 L504 560 L504 524" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M432 524 L432 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M776 640 L796 640 L796 704 L816 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M776 744 L816 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M776 840 L796 840 L796 768 L816 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M896 680 L896 584 L568 584 L568 640 L552 640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M432 712 L432 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M312 812 L264 812" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M432 880 L432 928" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M312 956 L144 956 L144 1032" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M432 984 L432 1032" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M552 1076 L600 1076" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M144 1120 L144 1160 L688 1160 L688 1136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M776 1084 L816 1084" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- nodes -->
<g data-node="GitHub milestones">
<rect x="24" y="148" width="240" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="148" width="240" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="144" y="172" class="name" text-anchor="middle">GitHub milestones</text>
<text x="144" y="192" class="mono sub" text-anchor="middle">open milestones only</text>
<text x="144" y="208" class="mono sub" text-anchor="middle">read on every run</text>
</g>
<g data-node="Owner approves">
<rect x="312" y="148" width="240" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="312" y="148" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="432" y="172" class="name" text-anchor="middle">Owner approves</text>
<text x="432" y="192" class="mono sub" text-anchor="middle">adds a milestone or</text>
<text x="432" y="208" class="mono sub" text-anchor="middle">removes triage label</text>
</g>
<g data-node="milestone_bands.py">
<rect x="24" y="268" width="240" height="88" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="268" width="240" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="144" y="292" class="name" text-anchor="middle">milestone_bands.py</text>
<text x="144" y="312" class="mono sub" text-anchor="middle">active: nearest due date</text>
<text x="144" y="328" class="mono sub" text-anchor="middle">next: next version</text>
<text x="144" y="344" class="mono sub" text-anchor="middle">gh down: disk cache</text>
</g>
<g data-node="Issue executor poll">
<rect x="312" y="268" width="240" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="312" y="268" width="240" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="432" y="292" class="name" text-anchor="middle">Issue executor poll</text>
<text x="432" y="312" class="mono sub" text-anchor="middle">every 5 minutes</text>
<text x="432" y="328" class="mono sub" text-anchor="middle">one executor per issue</text>
<text x="432" y="344" class="mono sub" text-anchor="middle">active milestone only</text>
<text x="432" y="360" class="mono sub" text-anchor="middle">delivered: ask the owner</text>
</g>
<g data-node="Coverage rule">
<rect x="600" y="268" width="240" height="120" rx="6" fill="#f5f5f5"/>
<rect class="box" x="600" y="268" width="240" height="120" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="720" y="292" class="name" text-anchor="middle">Coverage rule</text>
<text x="720" y="312" class="mono sub" text-anchor="middle">anchor only: Issue: #N,</text>
<text x="720" y="328" class="mono sub" text-anchor="middle">issue #N, Refs, Closes</text>
<text x="720" y="344" class="mono sub" text-anchor="middle">or Fixes #N; a loose #N</text>
<text x="720" y="360" class="mono sub" text-anchor="middle">is not coverage; keep-open</text>
<text x="720" y="376" class="mono sub" text-anchor="middle">only stops auto-close</text>
</g>
<g data-node="Priority bands">
<rect x="24" y="404" width="240" height="136" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="404" width="240" height="136" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="144" y="428" class="name" text-anchor="middle">Priority bands</text>
<text x="144" y="448" class="mono sub" text-anchor="middle">100  open PR to merge</text>
<text x="144" y="464" class="mono sub" text-anchor="middle">80  active milestone</text>
<text x="144" y="480" class="mono sub" text-anchor="middle">40  next milestone</text>
<text x="144" y="496" class="mono sub" text-anchor="middle">20  other open one</text>
<text x="144" y="512" class="mono sub" text-anchor="middle">no milestone, no band</text>
<text x="144" y="528" class="mono sub" text-anchor="middle">band from own anchor</text>
</g>
<g data-node="Card in ready">
<rect x="312" y="436" width="240" height="88" rx="6" fill="#f5f5f5"/>
<rect class="box" x="312" y="436" width="240" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="432" y="460" class="name" text-anchor="middle">Card in ready</text>
<text x="432" y="480" class="mono sub" text-anchor="middle">priority from its band</text>
<text x="432" y="496" class="mono sub" text-anchor="middle">queue: highest priority,</text>
<text x="432" y="512" class="mono sub" text-anchor="middle">then oldest first</text>
</g>
<g data-node="Admission gate">
<rect x="600" y="436" width="176" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="600" y="436" width="176" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="688" y="460" class="name" text-anchor="middle">Admission gate</text>
<text x="688" y="480" class="mono sub" text-anchor="middle">hourly board watchdog</text>
<text x="688" y="496" class="mono sub" text-anchor="middle">card or an ancestor</text>
<text x="688" y="512" class="mono sub" text-anchor="middle">refs approved work</text>
<text x="688" y="528" class="mono sub" text-anchor="middle">writes the cache</text>
</g>
<g data-node="Parked">
<rect x="816" y="436" width="160" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="816" y="436" width="160" height="104" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="896" y="460" class="name" text-anchor="middle">Parked</text>
<text x="896" y="480" class="mono sub" text-anchor="middle">kanban schedule</text>
<text x="896" y="496" class="mono sub" text-anchor="middle">with a marker</text>
<text x="896" y="512" class="mono sub" text-anchor="middle">returns once</text>
<text x="896" y="528" class="mono sub" text-anchor="middle">approved</text>
</g>
<g data-node="Dispatcher">
<rect x="312" y="608" width="240" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="312" y="608" width="240" height="104" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="432" y="632" class="name" text-anchor="middle">Dispatcher</text>
<text x="432" y="652" class="mono sub" text-anchor="middle">takes the dispatch lock</text>
<text x="432" y="668" class="mono sub" text-anchor="middle">highest priority first</text>
<text x="432" y="684" class="mono sub" text-anchor="middle">max 2 running in total</text>
<text x="432" y="700" class="mono sub" text-anchor="middle">and 2 per profile</text>
</g>
<g data-node="Quota stop">
<rect x="600" y="596" width="176" height="88" rx="6" fill="#f5f5f5"/>
<rect class="box" x="600" y="596" width="176" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="688" y="620" class="name" text-anchor="middle">Quota stop</text>
<text x="688" y="640" class="mono sub" text-anchor="middle">hermes-health</text>
<text x="688" y="656" class="mono sub" text-anchor="middle">every 10 minutes</text>
<text x="688" y="672" class="mono sub" text-anchor="middle">on quota error codes</text>
</g>
<g data-node="Peak pause">
<rect x="600" y="700" width="176" height="88" rx="6" fill="#f5f5f5"/>
<rect class="box" x="600" y="700" width="176" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="688" y="724" class="name" text-anchor="middle">Peak pause</text>
<text x="688" y="744" class="mono sub" text-anchor="middle">peak-pause-tick</text>
<text x="688" y="760" class="mono sub" text-anchor="middle">ops, every 15 min</text>
<text x="688" y="776" class="mono sub" text-anchor="middle">configured window</text>
</g>
<g data-node="Owner stop">
<rect x="600" y="804" width="176" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="600" y="804" width="176" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="688" y="828" class="name" text-anchor="middle">Owner stop</text>
<text x="688" y="848" class="mono sub" text-anchor="middle">labelled hold,</text>
<text x="688" y="864" class="mono sub" text-anchor="middle">outranks the others</text>
</g>
<g data-node="Dispatch lock">
<rect x="816" y="680" width="160" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="816" y="680" width="160" height="104" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="896" y="704" class="name" text-anchor="middle">Dispatch lock</text>
<text x="896" y="724" class="mono sub" text-anchor="middle">flock per board</text>
<text x="896" y="740" class="mono sub" text-anchor="middle">held: tick skipped</text>
<text x="896" y="756" class="mono sub" text-anchor="middle">workers finish</text>
<text x="896" y="772" class="mono sub" text-anchor="middle">reclaim silenced</text>
</g>
<g data-node="Admission guard">
<rect x="312" y="760" width="240" height="120" rx="6" fill="#f5f5f5"/>
<rect class="box" x="312" y="760" width="240" height="120" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="432" y="784" class="name" text-anchor="middle">Admission guard</text>
<text x="432" y="804" class="mono sub" text-anchor="middle">kanban-admission-guard</text>
<text x="432" y="820" class="mono sub" text-anchor="middle">on claim, before spawn</text>
<text x="432" y="836" class="mono sub" text-anchor="middle">reads the cache</text>
<text x="432" y="852" class="mono sub" text-anchor="middle">fail-open: no cache or</text>
<text x="432" y="868" class="mono sub" text-anchor="middle">cache older than 3 h</text>
</g>
<g data-node="Parked by guard">
<rect x="24" y="776" width="240" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="776" width="240" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="144" y="800" class="name" text-anchor="middle">Parked by guard</text>
<text x="144" y="820" class="mono sub" text-anchor="middle">same marker as gate</text>
<text x="144" y="836" class="mono sub" text-anchor="middle">gate handles return</text>
</g>
<g data-node="Worker run">
<rect class="box" x="312" y="928" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="432" y="952" class="name" text-anchor="middle">Worker run</text>
<text x="432" y="972" class="mono sub" text-anchor="middle">profile of the assignee</text>
</g>
<g data-node="Park until a moment">
<rect class="box" x="24" y="1032" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="144" y="1056" class="name" text-anchor="middle">Park until a moment</text>
<text x="144" y="1076" class="mono sub" text-anchor="middle">kanban schedule</text>
<text x="144" y="1092" class="mono sub" text-anchor="middle">SCHEDULED_UNTIL=&lt;UTC&gt;</text>
<text x="144" y="1108" class="mono sub" text-anchor="middle">never a transient block</text>
</g>
<g data-node="Wait for a PR merge">
<rect class="box" x="312" y="1032" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="432" y="1056" class="name" text-anchor="middle">Wait for a PR merge</text>
<text x="432" y="1076" class="mono sub" text-anchor="middle">needs_input block</text>
<text x="432" y="1092" class="mono sub" text-anchor="middle">Release condition:</text>
<text x="432" y="1108" class="mono sub" text-anchor="middle">PR #N merged</text>
</g>
<g data-node="worker-api-watchdog">
<rect x="600" y="1032" width="176" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="600" y="1032" width="176" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="688" y="1056" class="name" text-anchor="middle">worker-api-watchdog</text>
<text x="688" y="1076" class="mono sub" text-anchor="middle">every 10 minutes</text>
<text x="688" y="1092" class="mono sub" text-anchor="middle">moment passed: ready</text>
<text x="688" y="1108" class="mono sub" text-anchor="middle">PR merged: unblock</text>
<text x="688" y="1124" class="mono sub" text-anchor="middle">reclaims orphan runs</text>
</g>
<g data-node="Ready again">
<rect x="816" y="1048" width="160" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="816" y="1048" width="160" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="896" y="1072" class="name" text-anchor="middle">Ready again</text>
<text x="896" y="1092" class="mono sub" text-anchor="middle">back in the queue</text>
<text x="896" y="1108" class="mono sub" text-anchor="middle">by priority</text>
</g>
<!-- labels -->
<rect x="628" y="552" width="120" height="16" rx="2" fill="#f5f5f5"/>
<text x="688" y="564" class="mono lbl" text-anchor="middle">WHEN APPROVED</text>
<rect x="664" y="576" width="128" height="16" rx="2" fill="#f5f5f5"/>
<text x="728" y="588" class="mono lbl" text-anchor="middle">HOLDS DISPATCH</text>
<text x="440" y="740" class="mono lbl" text-anchor="start">CLAIM</text>
<text x="440" y="908" class="mono lbl" text-anchor="start">SPAWN</text>
<rect x="204" y="948" width="48" height="16" rx="2" fill="#f5f5f5"/>
<text x="228" y="960" class="mono lbl" text-anchor="middle">PARK</text>
<text x="440" y="1012" class="mono lbl" text-anchor="start">MERGE WAIT</text>
<text x="24" y="1196" class="note" text-anchor="start">Running cards are never preempted. Two transient blocks in a row send a card back to triage.</text>
<line x1="24" y1="1212" x2="976" y2="1212" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="24" y="1236" class="mono eyebrow" text-anchor="start">LEGEND</text>
<rect x="24" y="1252" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="48" y="1263" class="leg">Agent step</text>
<rect x="144" y="1252" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="168" y="1263" class="leg">Pack script, gate or plugin</text>
<rect x="384" y="1252" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="408" y="1263" class="leg">External or Hermes native</text>
<rect x="608" y="1252" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="632" y="1263" class="leg">Owner input</text>
<rect x="736" y="1252" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="760" y="1263" class="leg">Owner decision</text>
<line x1="24" y1="1282" x2="52" y2="1282" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="60" y="1287" class="leg">Handoff</text>
<line x1="136" y1="1282" x2="164" y2="1282" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<text x="172" y="1287" class="leg">GitHub</text>
<line x1="240" y1="1282" x2="268" y2="1282" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="276" y="1287" class="leg">Check or return</text>
</svg>
