<svg viewBox="0 0 1000 1200" width="1000" height="1200" xmlns="http://www.w3.org/2000/svg" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <style>
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
      .eyebrow { fill: #4f5d75; font-size: 12px; letter-spacing: 0.12em; }
      .name { fill: #2d3142; font-size: 15px; font-weight: 600; }
      .sub { fill: #4f5d75; font-size: 12px; }
      .lbl { fill: #4f5d75; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-accent { fill: #eb6c36; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-link { fill: #2e5aa8; font-size: 12px; letter-spacing: 0.06em; }
      .stage { fill: #4f5d75; font-size: 12px; letter-spacing: 0.06em; }
      .leg { fill: #4f5d75; font-size: 12px; }
      .note { fill: #4f5d75; font-size: 12px; }
    </style>
  </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="24" y="36" class="mono eyebrow" text-anchor="start">HERMES DARK FACTORY</text>
<text x="24" y="72" class="serif" fill="#2d3142" font-size="28">Where work comes from</text>
<text x="24" y="112" class="mono eyebrow" text-anchor="start">SOURCE</text>
<text x="296" y="112" class="mono eyebrow" text-anchor="start">ENTRY POINT</text>
<text x="544" y="112" class="mono eyebrow" text-anchor="start">LANDS IN</text>
<text x="792" y="112" class="mono eyebrow" text-anchor="start">OUTCOME</text>
<line x1="24" y1="124" x2="976" y2="124" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<line x1="24" y1="748" x2="976" y2="748" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
<text x="24" y="776" class="mono eyebrow" text-anchor="start">CARDS THAT SKIP TRIAGE</text>
<!-- arrows -->
<path d="M248 164 L792 164" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M248 188 L644 188 L644 252" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M248 280 L296 280" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M496 296 L544 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M248 424 L272 424 L272 516 L296 516" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M248 544 L296 544" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M248 664 L272 664 L272 572 L296 572" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M396 492 L396 420 L544 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M644 436 L644 508" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M744 544 L768 544 L768 440 L792 440" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M744 544 L792 544" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M744 544 L768 544 L768 656 L792 656" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M884 404 L884 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M884 700 L884 724 L644 724 L644 580" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M248 844 L296 844" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M496 844 L544 844" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M744 836 L792 836" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M248 972 L296 972" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M496 972 L544 972" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<path d="M744 980 L792 980" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M884 936 L884 872" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- nodes -->
<g data-node="GitHub issue">
<rect x="24" y="148" width="224" height="56" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="148" width="224" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="136" y="172" class="name" text-anchor="middle">GitHub issue</text>
<text x="136" y="192" class="mono sub" text-anchor="middle">filed by the owner</text>
</g>
<g data-node="Approved work">
<rect x="792" y="148" width="184" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="792" y="148" width="184" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="884" y="172" class="name" text-anchor="middle">Approved work</text>
<text x="884" y="192" class="mono sub" text-anchor="middle">executor card via</text>
<text x="884" y="208" class="mono sub" text-anchor="middle">poll and admission</text>
</g>
<g data-node="Message in Telegram">
<rect x="24" y="252" width="224" height="56" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="252" width="224" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="136" y="276" class="name" text-anchor="middle">Message in Telegram</text>
<text x="136" y="296" class="mono sub" text-anchor="middle">idea, bug, look into X</text>
</g>
<g data-node="Front desk">
<rect class="box" x="296" y="252" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="396" y="276" class="name" text-anchor="middle">Front desk</text>
<text x="396" y="296" class="mono sub" text-anchor="middle">default profile</text>
<text x="396" y="312" class="mono sub" text-anchor="middle">triage card + issue</text>
<text x="396" y="328" class="mono sub" text-anchor="middle">subscribes owner chat</text>
</g>
<g data-node="Awaiting triage">
<rect x="544" y="252" width="200" height="184" rx="6" fill="#f5f5f5"/>
<rect class="box" x="544" y="252" width="200" height="184" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="644" y="276" class="name" text-anchor="middle">Awaiting triage</text>
<text x="644" y="296" class="mono sub" text-anchor="middle">board triage cards</text>
<text x="644" y="312" class="mono sub" text-anchor="middle">issues labelled</text>
<text x="644" y="328" class="mono sub" text-anchor="middle">wait-for-triage</text>
<text x="644" y="344" class="mono sub" text-anchor="middle">admission parks them</text>
<text x="644" y="360" class="mono sub" text-anchor="middle">daily digest lists</text>
<text x="644" y="376" class="mono sub" text-anchor="middle">the queue</text>
</g>
<g data-node="ux-tick">
<rect class="box" x="24" y="372" width="224" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="136" y="396" class="name" text-anchor="middle">ux-tick</text>
<text x="136" y="416" class="mono sub" text-anchor="middle">daily 09:00, cheap model</text>
<text x="136" y="432" class="mono sub" text-anchor="middle">walks the running demo</text>
<text x="136" y="448" class="mono sub" text-anchor="middle">friction only, 45 calls</text>
<text x="136" y="464" class="mono sub" text-anchor="middle">screenshot per UI finding</text>
</g>
<g data-node="ceo-tick">
<rect class="box" x="24" y="492" width="224" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="136" y="516" class="name" text-anchor="middle">ceo-tick</text>
<text x="136" y="536" class="mono sub" text-anchor="middle">weekly, Sun 07:00, strong</text>
<text x="136" y="552" class="mono sub" text-anchor="middle">category, competitors,</text>
<text x="136" y="568" class="mono sub" text-anchor="middle">platform, user pain</text>
<text x="136" y="584" class="mono sub" text-anchor="middle">1 to 3 proposals</text>
</g>
<g data-node="cto-tick">
<rect class="box" x="24" y="612" width="224" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="136" y="636" class="name" text-anchor="middle">cto-tick</text>
<text x="136" y="656" class="mono sub" text-anchor="middle">weekly, Sun 08:00, strong</text>
<text x="136" y="672" class="mono sub" text-anchor="middle">security, CI, debt, stack,</text>
<text x="136" y="688" class="mono sub" text-anchor="middle">upstream, standard gaps</text>
<text x="136" y="704" class="mono sub" text-anchor="middle">1 to 3 issues + summary</text>
</g>
<g data-node="GitHub issues">
<rect x="296" y="492" width="200" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="296" y="492" width="200" height="104" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="396" y="516" class="name" text-anchor="middle">GitHub issues</text>
<text x="396" y="536" class="mono sub" text-anchor="middle">wait-for-triage label</text>
<text x="396" y="552" class="mono sub" text-anchor="middle">no milestone</text>
<text x="396" y="568" class="mono sub" text-anchor="middle">no board card</text>
<text x="396" y="584" class="mono sub" text-anchor="middle">deduplicated first</text>
</g>
<g data-node="Owner decides">
<rect x="544" y="508" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="544" y="508" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="644" y="532" class="name" text-anchor="middle">Owner decides</text>
<text x="644" y="552" class="mono sub" text-anchor="middle">go, no, investigate</text>
<text x="644" y="568" class="mono sub" text-anchor="middle">by meaning</text>
</g>
<g data-node="Go">
<rect class="box" x="792" y="404" width="184" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="884" y="428" class="name" text-anchor="middle">Go</text>
<text x="884" y="448" class="mono sub" text-anchor="middle">triage label removed</text>
<text x="884" y="464" class="mono sub" text-anchor="middle">architect decomposes</text>
</g>
<g data-node="No">
<rect x="792" y="500" width="184" height="88" rx="6" fill="#f5f5f5"/>
<rect class="box" x="792" y="500" width="184" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="884" y="524" class="name" text-anchor="middle">No</text>
<text x="884" y="544" class="mono sub" text-anchor="middle">issue closed as</text>
<text x="884" y="560" class="mono sub" text-anchor="middle">not planned,</text>
<text x="884" y="576" class="mono sub" text-anchor="middle">card archived</text>
</g>
<g data-node="Investigate">
<rect class="box" x="792" y="612" width="184" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="884" y="636" class="name" text-anchor="middle">Investigate</text>
<text x="884" y="656" class="mono sub" text-anchor="middle">card stays in triage,</text>
<text x="884" y="672" class="mono sub" text-anchor="middle">agent researches and</text>
<text x="884" y="688" class="mono sub" text-anchor="middle">rewrites the issue</text>
</g>
<g data-node="Card generators">
<rect x="24" y="800" width="224" height="104" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="800" width="224" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="136" y="824" class="name" text-anchor="middle">Card generators</text>
<text x="136" y="844" class="mono sub" text-anchor="middle">issue executor poll</text>
<text x="136" y="860" class="mono sub" text-anchor="middle">artifact guard plugin</text>
<text x="136" y="876" class="mono sub" text-anchor="middle">rework gate</text>
<text x="136" y="892" class="mono sub" text-anchor="middle">owner-merge hold</text>
</g>
<g data-node="Native or live?">
<rect x="296" y="800" width="200" height="88" rx="6" fill="#f5f5f5"/>
<rect class="box" x="296" y="800" width="200" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="396" y="824" class="name" text-anchor="middle">Native or live?</text>
<text x="396" y="844" class="mono sub" text-anchor="middle">board_native_guard</text>
<text x="396" y="860" class="mono sub" text-anchor="middle">covered: extend it</text>
<text x="396" y="876" class="mono sub" text-anchor="middle">or wait for it</text>
</g>
<g data-node="New card">
<rect x="544" y="800" width="200" height="88" rx="6" fill="#f5f5f5"/>
<rect class="box" x="544" y="800" width="200" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="644" y="824" class="name" text-anchor="middle">New card</text>
<text x="644" y="844" class="mono sub" text-anchor="middle">idempotency key</text>
<text x="644" y="860" class="mono sub" text-anchor="middle">receipt in the body</text>
<text x="644" y="876" class="mono sub" text-anchor="middle">band of its issue</text>
</g>
<g data-node="Admission">
<rect x="792" y="800" width="184" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="792" y="800" width="184" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="884" y="824" class="name" text-anchor="middle">Admission</text>
<text x="884" y="844" class="mono sub" text-anchor="middle">parks unapproved</text>
<text x="884" y="860" class="mono sub" text-anchor="middle">work, then dispatch</text>
</g>
<g data-node="Formal PR review">
<rect x="24" y="936" width="224" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="24" y="936" width="224" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="136" y="960" class="name" text-anchor="middle">Formal PR review</text>
<text x="136" y="980" class="mono sub" text-anchor="middle">APPROVED or</text>
<text x="136" y="996" class="mono sub" text-anchor="middle">CHANGES_REQUESTED</text>
</g>
<g data-node="Webhook">
<rect x="296" y="936" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect class="box" x="296" y="936" width="200" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="396" y="960" class="name" text-anchor="middle">Webhook</text>
<text x="396" y="980" class="mono sub" text-anchor="middle">owner events only</text>
<text x="396" y="996" class="mono sub" text-anchor="middle">to default profile</text>
</g>
<g data-node="Find the owner card">
<rect class="box" x="544" y="936" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="644" y="960" class="name" text-anchor="middle">Find the owner card</text>
<text x="644" y="980" class="mono sub" text-anchor="middle">same PR and head</text>
<text x="644" y="996" class="mono sub" text-anchor="middle">live: comment on it</text>
<text x="644" y="1012" class="mono sub" text-anchor="middle">closed: cycle card</text>
</g>
<g data-node="Cycle card">
<rect class="box" x="792" y="936" width="184" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="884" y="960" class="name" text-anchor="middle">Cycle card</text>
<text x="884" y="980" class="mono sub" text-anchor="middle">key from PR + head</text>
<text x="884" y="996" class="mono sub" text-anchor="middle">big verdict: umbrella</text>
<text x="884" y="1012" class="mono sub" text-anchor="middle">+ child per BLOCK</text>
<text x="884" y="1028" class="mono sub" text-anchor="middle">empty: record, close</text>
</g>
<!-- labels -->
<rect x="664" y="156" width="112" height="16" rx="2" fill="#f5f5f5"/>
<text x="720" y="168" class="mono lbl-link" text-anchor="middle">IN MILESTONE</text>
<rect x="340" y="180" width="112" height="16" rx="2" fill="#f5f5f5"/>
<text x="396" y="192" class="mono lbl-link" text-anchor="middle">NO MILESTONE</text>
<rect x="340" y="448" width="112" height="16" rx="2" fill="#f5f5f5"/>
<text x="396" y="460" class="mono lbl" text-anchor="middle">AWAIT TRIAGE</text>
<rect x="840" y="304" width="88" height="16" rx="2" fill="#f5f5f5"/>
<text x="884" y="316" class="mono lbl" text-anchor="middle">DECOMPOSE</text>
<rect x="696" y="716" width="136" height="16" rx="2" fill="#f5f5f5"/>
<text x="764" y="728" class="mono lbl" text-anchor="middle">SECOND DECISION</text>
<text x="24" y="1072" class="note" text-anchor="start">Big verdict: 3 or more BLOCK items, or 6 or more findings. Every generated card carries an idempotency key.</text>
<line x1="24" y1="1088" x2="976" y2="1088" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="24" y="1112" class="mono eyebrow" text-anchor="start">LEGEND</text>
<rect x="24" y="1128" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="48" y="1139" class="leg">Agent step</text>
<rect x="144" y="1128" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="168" y="1139" class="leg">Pack script or gate</text>
<rect x="328" y="1128" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="352" y="1139" class="leg">External or Hermes native</text>
<rect x="552" y="1128" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="576" y="1139" class="leg">Owner input</text>
<rect x="680" y="1128" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="704" y="1139" class="leg">Owner decision</text>
<line x1="24" y1="1158" x2="52" y2="1158" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="60" y="1163" class="leg">Internal handoff</text>
<line x1="196" y1="1158" x2="224" y2="1158" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<text x="232" y="1163" class="leg">GitHub or Telegram</text>
<line x1="384" y1="1158" x2="412" y2="1158" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="420" y="1163" class="leg">Loop</text>
<line x1="472" y1="1158" x2="500" y2="1158" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="508" y="1163" class="leg">Owner decision path</text>
</svg>
