<svg viewBox="0 0 1000 852" width="1000" height="852" xmlns="http://www.w3.org/2000/svg" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <style>
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
      .stage { fill: #4f5d75; font-size: 12px; letter-spacing: 0.14em; }
      .name { fill: #2d3142; font-size: 15px; font-weight: 600; }
      .sub { fill: #4f5d75; font-size: 12px; }
      .desc { fill: #2d3142; font-size: 12px; }
      .tag { fill: #7a8399; font-size: 12px; letter-spacing: 0.06em; }
      .lbl { fill: #4f5d75; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-accent { fill: #eb6c36; font-size: 12px; letter-spacing: 0.06em; }
      .lbl-link { fill: #2e5aa8; font-size: 12px; letter-spacing: 0.06em; }
      .leg { fill: #4f5d75; font-size: 12px; }
      .cell { fill: #2d3142; font-size: 13px; }
      .num { fill: #2d3142; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="36" class="mono stage">HERMES DARK FACTORY · GATES MAP 2 OF 2</text>
  <text x="40" y="72" class="serif" fill="#2d3142" font-size="28">Gates around a pull request: push, publish, review</text>
  <rect x="40" y="112" width="136" height="28" rx="14" fill="#f5f5f5" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="108" y="130" class="mono lbl" text-anchor="middle">1 · CREATED</text>
  <path d="M178 126 H194" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="196" y="112" width="136" height="28" rx="14" fill="#f5f5f5" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="264" y="130" class="mono lbl" text-anchor="middle">2 · RUN WORKS</text>
  <path d="M334 126 H350" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="352" y="112" width="136" height="28" rx="14" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="420" y="130" class="mono num" text-anchor="middle">3 · PUSH</text>
  <path d="M490 126 H506" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="508" y="112" width="136" height="28" rx="14" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="576" y="130" class="mono num" text-anchor="middle">4 · ON THE PR</text>
  <path d="M646 126 H662" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="664" y="112" width="136" height="28" rx="14" fill="#f5f5f5" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="732" y="130" class="mono lbl" text-anchor="middle">5 · CLOSES</text>
  <rect x="820" y="112" width="136" height="28" rx="14" fill="#f5f5f5" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="888" y="130" class="mono lbl" text-anchor="middle">6 · BOARD-WIDE</text>
  <text x="40" y="176" class="mono stage">3 · ON COMMIT, PUSH AND PUBLISH</text>
  <text x="960" y="176" class="leg" text-anchor="end">git hooks and the gh wrapper, fail closed</text>
  <line x1="40" y1="186" x2="968" y2="186" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
